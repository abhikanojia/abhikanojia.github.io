<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="unhealthy-title unhealthy-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="unhealthy-title">Rails SaaS billing architecture after years of drift</title>
  <desc id="unhealthy-desc">Multiple writers (Stripe webhooks, admin panel, rake tasks) update multiple overlapping state stores (users.active, subscriptions.status, Redis cache, legacy paid_until column), which combined with feature flag overrides feed scattered authorization checks throughout the Rails application.</desc>

  <defs>
    <marker id="arrow-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .node        { fill: #f7fafc; stroke: #2d3748; stroke-width: 1.5; }
      .node-source { fill: #edf2f7; stroke: #1a202c; stroke-width: 1.5; }
      .node-warn   { fill: #fff5f5; stroke: #9b2c2c; stroke-width: 1.5; }
      .node-auth   { fill: #fefcbf; stroke: #744210; stroke-width: 1.5; }
      .label       { fill: #1a202c; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .label-sm    { fill: #1a202c; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .sublabel    { fill: #4a5568; font-size: 12px; font-style: italic; text-anchor: middle; }
      .edge        { stroke: #4a5568; stroke-width: 1.5; fill: none; }
      .edge-dashed { stroke: #4a5568; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .edge-label  { fill: #4a5568; font-size: 11px; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- Row 1: writers -->
  <rect class="node-source" x="40"  y="20" width="180" height="50" rx="6"/>
  <text class="label" x="130" y="51">Stripe</text>

  <rect class="node-source" x="410" y="20" width="180" height="50" rx="6"/>
  <text class="label" x="500" y="51">Admin Panel</text>

  <rect class="node-source" x="780" y="20" width="180" height="50" rx="6"/>
  <text class="label" x="870" y="51">Rake Tasks / Console</text>

  <!-- Row 2: Webhook Handler -->
  <rect class="node" x="40" y="150" width="180" height="50" rx="6"/>
  <text class="label" x="130" y="181">Webhook Handler</text>

  <!-- Row 3: state stores -->
  <rect class="node-warn" x="20"  y="310" width="160" height="60" rx="6"/>
  <text class="label-sm" x="100" y="345">users.active flag</text>

  <rect class="node-warn" x="200" y="310" width="180" height="60" rx="6"/>
  <text class="label-sm" x="290" y="345">subscriptions.status</text>

  <rect class="node-warn" x="400" y="310" width="160" height="60" rx="6"/>
  <text class="label-sm" x="480" y="345">Redis cache flag</text>

  <rect class="node-warn" x="580" y="310" width="180" height="60" rx="6"/>
  <text class="label-sm" x="670" y="338">Legacy</text>
  <text class="label-sm" x="670" y="356">paid_until column</text>

  <rect class="node-warn" x="780" y="310" width="200" height="60" rx="6"/>
  <text class="label-sm" x="880" y="338">Feature flag</text>
  <text class="label-sm" x="880" y="356">overrides</text>

  <!-- Row 4: Authorization -->
  <rect class="node-auth" x="200" y="470" width="600" height="80" rx="8"/>
  <text class="label" x="500" y="504">Authorization checks</text>
  <text class="sublabel" x="500" y="526">scattered across app</text>

  <!-- Row 5: Rails Application -->
  <rect class="node" x="400" y="640" width="200" height="60" rx="6"/>
  <text class="label" x="500" y="676">Rails Application</text>

  <!-- Edges: writers → intermediate/state -->
  <!-- Stripe → Webhook Handler -->
  <path class="edge" d="M130,70 L130,148" marker-end="url(#arrow-u)"/>

  <!-- Stripe → Rake Tasks (manual reconcile, dashed) -->
  <path class="edge-dashed" d="M220,35 L780,35" marker-end="url(#arrow-u)"/>
  <text class="edge-label" x="500" y="27">manual reconcile</text>

  <!-- Webhook Handler → users.active -->
  <path class="edge" d="M105,200 L102,308" marker-end="url(#arrow-u)"/>
  <!-- Webhook Handler → subscriptions.status -->
  <path class="edge" d="M160,200 L275,308" marker-end="url(#arrow-u)"/>
  <!-- Webhook Handler → Redis cache flag -->
  <path class="edge" d="M200,200 L455,308" marker-end="url(#arrow-u)"/>

  <!-- Admin Panel → users.active -->
  <path class="edge" d="M440,70 L130,308" marker-end="url(#arrow-u)"/>
  <!-- Admin Panel → subscriptions.status -->
  <path class="edge" d="M490,70 L300,308" marker-end="url(#arrow-u)"/>

  <!-- Rake Tasks → subscriptions.status -->
  <path class="edge" d="M820,70 L350,308" marker-end="url(#arrow-u)"/>

  <!-- State → Authorization -->
  <path class="edge" d="M100,370 L260,468" marker-end="url(#arrow-u)"/>
  <path class="edge" d="M290,370 L380,468" marker-end="url(#arrow-u)"/>
  <path class="edge" d="M480,370 L500,468" marker-end="url(#arrow-u)"/>
  <path class="edge" d="M670,370 L620,468" marker-end="url(#arrow-u)"/>
  <path class="edge" d="M880,370 L750,468" marker-end="url(#arrow-u)"/>

  <!-- Authorization → Rails Application -->
  <path class="edge" d="M500,550 L500,638" marker-end="url(#arrow-u)"/>
</svg>
